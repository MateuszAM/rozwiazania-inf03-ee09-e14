<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylizacja paznokci</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <aside>
        <img src="manicure.jpg" alt="Stylizacja paznokci">
    </aside>
    <main>
        <header>
            <h1>Twoje wymarzone paznokcie</h1>
        </header>
        <nav>
            <button id="kolorButton" onmouseover="zmianaSekcji('kolorSection')">Kolor</button>
            <button id="ksztaltButton" onmouseover="zmianaSekcji('ksztaltSection')">Kształt</button>
            <button id="wzorButton" onmouseover="zmianaSekcji('wzorSection')">Wzór</button>
        </nav>
        <section id="kolorSection">
            <h2>Kolor</h2>
            <img src="kolory.png" alt="Kolory paznokci">
            <br>
            <input type="color" name="kolorPaznokci" value="#FF0000">
        </section>
        <section id="ksztaltSection">
            <h2>Kształt</h2>
            <img src="ksztalt.png" alt="Kształty paznokci">
            <br>
            <select name="ksztaltOption">
                <option value="migdał">migdał</option>
                <option value="zaokrąglony">zaokrąglony</option>
                <option value="kwadratowy">kwadratowy</option>
                <option value="balerina">balerina</option>
                <option value="zaokrąglony kwadrat">zaokrąglony kwadrat</option>
            </select>
        </section>
        <section id="wzorSection">
            <h2>Wzór</h2>
            <!-- Skrypt 1 -->
             <script>
                for(let i = 1; i<=10; i++){
                    document.write(`<img src="${i}.jpg" title="${i}" class="wzory">`);
                }
             </script>
             <br>
            <input type="number" name="wzorNumber" min="1" max="10" step="1">
        </section>
    </main>
    <footer>
        <p>Stronę opracował: <em><a href="https://github.com/MateuszAM" target="_blank" style="font-size: unset; color: unset; margin: unset;text-decoration: none !important;">MateuszAM</a></p></em>
    </footer>
    <script src="main.js"></script>
</body>
</html>
