<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>malarz</title>
    <link rel="stylesheet" href="styl_1.css">
</head>
<body>
    <header>
        <h1>Malowanie pokoi i biur</h1>
    </header>
    <main>
        <section id="left">
            <h2>Menu</h2>
            <ul>
                <li><a href="mieszamy.html">Mieszamy</a></li>
                <li><a href="cena.html">Wyceniamy</a></li>
            </ul>
        </section>
        <section id="center">
            <h2>Zapotrzebowanie na farbę</h2>
            <form>
                <label for="metry">Powierzchnia malowania (m<sup>2</sup>): </label>
                <input type="number" id="metry">
                <button type="button" onclick="oblicz()">Policz</button>
            </form>
            <p id="wynik"></p>
        </section>
        <section id="right">
            <img src="obraz.png" alt="Próbki farb">
        </section>
    </main>
    <footer>
        <h3>MALARZ</h3>
        <p>Stronę opracował: <a href="https://github.com/MateuszAM" target="_blank" style="font-size: unset; color: unset; margin: unset;text-decoration: none !important; padding: 0 !important;">MateuszAM</a></p>
    </footer>
    <script>
        function oblicz(){
            let metry = document.getElementById("metry").value;
            let wynik = document.getElementById("wynik");
            let obliczenia = Math.ceil(metry / 4);
            wynik.innerHTML = `Liczba potrzebnych puszek: ${obliczenia}`;
        }
    </script>
</body>
</html>
